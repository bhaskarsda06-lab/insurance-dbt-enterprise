version: 2

sources:
  - name: bronze
    description: "Bronze/source tables used by the insurance dbt project."
    schema: bronze

    tables:
      - name: customer
        description: "Customer source data."

        config:
          loaded_at_field: updated_at
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour

        columns:
          - name: customer_id
            description: "Business key for customer."
            data_tests:
              - not_null
              - unique

          - name: updated_at
            description: "Last update timestamp."

      - name: policy
        description: "Policy source data."

        columns:
          - name: policy_id
            data_tests:
              - not_null
              - unique

      - name: payment
        description: "Payment source data."

        columns:
          - name: payment_id
            data_tests:
              - not_null
              - unique