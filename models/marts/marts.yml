version: 2

models:
  - name: dim_customer
    description: "Customer dimension."
    columns:
      - name: customer_id
        description: "Business key."
        data_tests:
          - not_null
          - unique
      - name: customer_name
        data_tests:
          - not_null

  - name: dim_policy
    description: "Policy dimension."
    columns:
      - name: policy_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id

  - name: fact_payment
    description: "Incremental payment fact."
    config:
      contract:
        enforced: true
    columns:
      - name: payment_id
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: policy_id
        data_type: string
      - name: payment_amount
        data_type: decimal(18,2)
      - name: payment_date
        data_type: date
      - name: payment_status
        data_type: string
      - name: dbt_loaded_at
        data_type: timestamp

  - name: customer_policy_summary
    description: "Customer-level policy and payment aggregate."
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
