name: Deploy Databricks dbt Project

on:
  push:
    branches: [develop, uat, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'develop' && 'dev' || 'uat' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          dbt --version

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Create Databricks CLI Profile
        run: |
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host = ${{ secrets.DATABRICKS_HOST }}
          token = ${{ secrets.DATABRICKS_TOKEN }}
          EOF
          chmod 600 ~/.databrickscfg

      - name: Create dbt Profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          insurance_dbt:
            target: ${{ vars.DBT_TARGET }}
            outputs:
              dev:
                type: databricks
                method: http
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: ${{ vars.DBT_CATALOG }}
                schema: ${{ vars.DBT_SCHEMA }}
                threads: 4
              uat:
                type: databricks
                method: http
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: ${{ vars.DBT_CATALOG }}
                schema: ${{ vars.DBT_SCHEMA }}
                threads: 4
              prod:
                type: databricks
                method: http
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: ${{ vars.DBT_CATALOG }}
                schema: ${{ vars.DBT_SCHEMA }}
                threads: 4
          EOF
          chmod 600 ~/.dbt/profiles.yml

      - name: Install Dependencies
        run: dbt deps --profiles-dir ~/.dbt

      - name: Parse
        run: dbt parse --profiles-dir ~/.dbt

      - name: Validate Connection
        run: dbt debug --profiles-dir ~/.dbt

      - name: Build Models and Tests
        run: dbt build --profiles-dir ~/.dbt

      - name: Source Freshness
        continue-on-error: true
        run: dbt source freshness --profiles-dir ~/.dbt

      - name: Generate Docs
        run: dbt docs generate --profiles-dir ~/.dbt

      - name: Upload dbt Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-${{ github.ref_name }}-${{ github.run_number }}
          path: target/
          if-no-files-found: warn
          retention-days: 30
