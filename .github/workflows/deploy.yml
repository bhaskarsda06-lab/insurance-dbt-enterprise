name: Deploy Databricks dbt Project

on:
  push:
    branches:
      - develop
      - uat
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'develop' && 'dev' || 'uat' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt Databricks
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks
          dbt --version

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Create Databricks CLI Profile
        run: |
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host = ${{ secrets.DATABRICKS_HOST }}
          token = ${{ secrets.DATABRICKS_TOKEN }}
          EOF

          chmod 600 ~/.databrickscfg

      - name: Create dbt Profile
  shell: bash
  run: |
    mkdir -p ~/.dbt

    cat > ~/.dbt/profiles.yml << EOF
    insurance_dbt:
      target: dev
      outputs:
        dev:
          type: databricks
          method: http
          host: ${{ secrets.DATABRICKS_HOST }}
          http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
          token: ${{ secrets.DATABRICKS_TOKEN }}
          catalog: hive_metastore
          schema: default
          threads: 4
    EOF

    echo "===== CREATED PROFILE ====="
    cat ~/.dbt/profiles.yml
          
      - name: Verify dbt Profile
        run: |
          ls -la ~/.dbt
          test -f ~/.dbt/profiles.yml

      - name: Install dbt Dependencies
        run: |
          dbt deps --profiles-dir ~/.dbt

      - name: Debug dbt Configuration
        run: |
          echo "===== dbt_project.yml ====="
          cat dbt_project.yml

          echo ""
          echo "===== profiles.yml ====="
          cat ~/.dbt/profiles.yml
     - name: Show dbt files
       run: |
          echo "===== dbt_project.yml ====="
          cat dbt_project.yml

          echo ""
          echo "===== profiles.yml ====="
          cat ~/.dbt/profiles.yml
     - name: Show Generated Profile
      run: |
          echo "===== PROFILE FILE ====="
          ls -la ~/.dbt
          cat ~/.dbt/profiles.yml

      - name: Parse Project
        run: |
          dbt parse --profiles-dir ~/.dbt

      - name: Validate Connection
        run: |
          dbt debug --profiles-dir ~/.dbt

      - name: Run Models
        run: |
          dbt run --profiles-dir ~/.dbt

      - name: Run Tests
        run: |
          dbt test --profiles-dir ~/.dbt

      - name: Check Source Freshness
        continue-on-error: true
        run: |
          dbt source freshness --profiles-dir ~/.dbt

      - name: Generate Docs
        run: |
          dbt docs generate --profiles-dir ~/.dbt

      - name: Upload dbt Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-${{ github.ref_name }}-${{ github.run_number }}
          path: target/
          if-no-files-found: warn
          retention-days: 30